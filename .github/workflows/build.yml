name: Päivitä ohjelmatiedot

on:
  schedule:
    - cron: "15 * * * *"        # kerran tunnissa
  workflow_dispatch:            # käsin: Actions → Päivitä ohjelmatiedot → Run workflow
  push:
    branches: [main]
    paths: ["data/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Rakenna JSON-tiedostot
        run: python scripts/build.py --out public --days 7
        env:
          THESPORTSDB_KEY: ${{ secrets.THESPORTSDB_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
